name: Publish latest binaries to Cloudflare R2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotfiles-r2-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Format, test, and lint
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked -- -D warnings

      - name: Validate Linux bootstrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n bootstrap/install.sh
          bash tests/bootstrap.sh

      - name: Validate Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File .\\tests\\bootstrap.ps1

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dotfiles-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/dotfiles
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dotfiles-windows-x86_64.exe
            binary: target/x86_64-pc-windows-msvc/release/dotfiles.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          sha256sum "dist/${{ matrix.artifact }}" \
            | sed "s#  .*#  ${{ matrix.artifact }}#" \
            > "dist/${{ matrix.artifact }}.sha256"

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath '${{ matrix.binary }}' -Destination 'dist\${{ matrix.artifact }}'
          $hash = (Get-FileHash -LiteralPath 'dist\${{ matrix.artifact }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist\${{ matrix.artifact }}.sha256' -Value "$hash  ${{ matrix.artifact }}" -NoNewline

      - name: Stage build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish latest binaries to R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload latest binaries and checksums to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: >-
          aws s3 sync dist/
          "s3://${R2_BUCKET}/dotfiles/"
          --delete
          --cache-control "no-cache, no-store, must-revalidate"
          --no-progress
          --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
