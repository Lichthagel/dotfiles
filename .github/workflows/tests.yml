name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test Linux bootstrap
        run: bash tests/bootstrap.sh

  rust-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test Windows bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\bootstrap.ps1

  legacy-bash:
    name: Legacy Bash tests (until cleanup)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: Run Bash tests
        run: |
          bash tests/test-install.sh
          bash tests/test-packages.sh
          bash tests/test-secrets.sh

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=error

  legacy-powershell:
    name: Legacy PowerShell tests (until cleanup)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Run PowerShell tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tests\test-install.ps1
          pwsh -NoProfile -File .\tests\test-packages.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error -EnableExit
