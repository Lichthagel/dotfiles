name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test Linux bootstrap
        run: bash tests/bootstrap.sh

  rust-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test Windows bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\bootstrap.ps1
