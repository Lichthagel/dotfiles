[package]
name = "dotfiles"
version = "0.1.0"
edition = "2021"

[lib]
name = "dotfiles"
path = "src/lib.rs"

[[bin]]
name = "dotfiles"
path = "src/main.rs"

[dependencies]
age = "0.11"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
